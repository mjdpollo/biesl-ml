[project]
name = "biesl-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "neurokit2>=0.2.12",
    "numpy>=2.4.5",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.12.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "gdown>=6.0.0",
]
notebook = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.7",
]
